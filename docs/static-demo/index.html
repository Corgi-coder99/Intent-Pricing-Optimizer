<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intent Pricing Optimizer — demo</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
:root{--navy:#1f3a5f;--blue:#2f7fc1;--orange:#f39c12;--red:#d64545;--green:#2e9e6b;--bg:#f4f6f9;--ink:#1b2a3d;--line:#e3e8ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans Pro","Segoe UI",system-ui,-apple-system,Arial,sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:18px 20px 40px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
h1{font-size:1.5rem;color:var(--navy);margin:0}
.sub{color:#5b6b80;font-size:.92rem;margin:4px 0 0}
.ctl{display:flex;gap:10px;align-items:center}
select,button.lg{font:inherit;padding:7px 10px;border:1px solid #c9d1dc;border-radius:8px;background:#fff;color:var(--ink)}
button.lg{cursor:pointer;font-weight:600}
label{font-size:.85rem;color:#5b6b80;display:block;margin-bottom:3px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}
.kpi{border-radius:8px;padding:14px 10px;color:#fff;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.kpi .v{font-size:clamp(1.1rem,2vw,1.9rem);font-weight:700;line-height:1.1;white-space:nowrap}
.kpi .l{font-size:.82rem;opacity:.93;margin-top:3px}
.agent{border-left:5px solid var(--blue);background:#eef5fc;padding:12px 16px;border-radius:6px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.grid.b{grid-template-columns:1fr 1.2fr}
.grid.c{grid-template-columns:1.1fr 0.9fr}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:14px;min-width:0}
.pt{font-weight:600;color:var(--navy);font-size:.95rem;margin:4px 0 0 4px}
.note{font-size:.85rem;color:#5b6b80;margin-top:6px}
.note a{color:var(--blue);font-weight:600}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid,.grid.b,.grid.c{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="title"></h1><p class="sub" id="subtitle"></p></div>
    <div class="ctl">
      <div><label id="lbl-product" for="prod"></label><select id="prod"></select></div>
      <button class="lg" id="lang" aria-label="Language"></button>
    </div>
  </header>
  <div class="kpis" id="kpis"></div>
  <div class="agent" id="agent"></div>
  <div class="grid">
    <div class="panel"><div class="pt" id="t-curve"></div><div id="c-curve"></div></div>
    <div class="panel"><div class="pt" id="t-comp"></div><div id="c-comp"></div></div>
  </div>
  <div class="grid b">
    <div class="panel"><div class="pt" id="t-map"></div><div id="c-map"></div></div>
    <div class="panel"><div class="pt" id="t-region"></div><div id="c-region"></div></div>
  </div>
  <div class="grid c">
    <div class="panel"><div class="pt" id="t-gap"></div><div id="c-gap"></div></div>
    <div class="panel"><div class="pt" id="t-cb"></div><div id="c-cb"></div></div>
  </div>
  <p class="note" id="note"></p>
  <p class="note"><a id="repo" href="https://github.com/Corgi-coder99/Intent-Pricing-Optimizer" target="_blank" rel="noopener"></a></p>
</div>

                   S("col_sentiment") + ": %{customdata[3]:.2f}<extra></extra>"}],
    {...base(), height: 360, margin: {l: 0, r: 0, t: 10, b: 0}, geo: {scope: "europe", lataxis: {range: [41, 52]}, lonaxis: {range: [-5.5, 9.5]},
      showcountries: true, countrycolor: "#c9d1dc", showland: true, landcolor: "#f4f6f9", showocean: true, oceancolor: "#e8f1fa", resolution: 50}}, cfg);

  // 4. region combo
  const rs = R.slice().sort((a, b) => a.revenue - b.revenue);
  Plotly.react("c-region", [
    {type: "bar", x: rs.map(r => r.region), y: rs.map(r => r.revenue), name: S("revenue_eur"), marker: {color: BLUE},
     hovertemplate: "%{x}<br>" + S("revenue_eur") + ": %{y:,.0f}<extra></extra>"},
    {type: "scatter", mode: "lines+markers", x: rs.map(r => r.region), y: rs.map(r => r.conversion_rate * 100), name: S("conv_pct"), yaxis: "y2", line: {color: ORANGE, width: 3},
     hovertemplate: "%{x}<br>" + S("conv_pct") + ": %{y:.1f}<extra></extra>"},
    {type: "scatter", mode: "lines+markers", x: rs.map(r => r.region), y: rs.map(r => r.avg_sentiment * 100), name: S("sentiment_x100"), yaxis: "y2", line: {color: GREEN, width: 2, dash: "dot"},
     hovertemplate: "%{x}<br>" + S("sentiment_x100") + ": %{y:.1f}<extra></extra>"}],
    {...base(), height: 360, margin: {l: 60, r: 50, t: 70, b: 40}, yaxis: {tickformat: ",.0f"}, yaxis2: {overlaying: "y", side: "right", showgrid: false}}, cfg);

  // 5. category gap
  Plotly.react("c-gap", [{type: "bar", x: D.gap.map(g => g.label[lang]), y: D.gap.map(g => g.gap),
    text: D.gap.map(g => (g.gap >= 0 ? "+" : "−") + pct(Math.abs(g.gap))), textposition: "auto",
    marker: {color: D.gap.map(g => g.gap > 0 ? RED : GREEN)}, hovertemplate: "%{x}<br>" + S("gap_axis") + ": %{y:+.1f}<extra></extra>"}],
    {...base(), height: 300, margin: {l: 55, r: 15, t: 10, b: 40}, yaxis: {title: S("gap_axis")}, showlegend: false}, cfg);

  // 6. complaints
  const tot = D.complaints.reduce((a, b) => a + b.sessions, 0);
  Plotly.react("c-cb", [{type: "pie", hole: .45, labels: D.complaints.map(x => x.label[lang]), values: D.complaints.map(x => x.sessions),
    text: D.complaints.map(x => pct(x.sessions / tot * 100)), textinfo: "text", marker: {colors: [GREEN, ORANGE, RED, BLUE]},
    hovertemplate: "%{label}<br>" + S("col_sessions") + ": %{value:,.0f}<extra></extra>"}],
    {...base(), height: 300, margin: {l: 10, r: 10, t: 10, b: 10}, legend: {orientation: "h", y: -0.1}}, cfg);
}
document.getElementById("prod").onchange = e => { pi = +e.target.value; render(); };
document.getElementById("lang").onclick = () => { lang = lang === "fr" ? "en" : "fr"; try { localStorage.setItem("lang", lang); } catch (e) {} render(); };
render();
</script>
</body>
</html>
